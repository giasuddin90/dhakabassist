{% extends "accounts/_auth_shell.html" %}

{% block auth_body %}
  <form method="post" class="stack u-gap-16" novalidate>
    {% csrf_token %}
    {% include "includes/form_errors.html" %}
    {% for field in form %}{% include "includes/field.html" with field=field %}{% endfor %}
    <button class="btn" type="submit" style="align-self:flex-start">Save new password</button>
  </form>
{% endblock %}
