[flake8]
# 100 for code. The few longer lines are prose constants — module summaries
# and FAQ answers — where wrapping would hurt readability more than it helps.
max-line-length = 110
extend-ignore = E203, W503
exclude = .venv,*/migrations/*,staticfiles,node_modules

[tool:isort]
profile = black
line_length = 100
known_first_party = accounts,courses,orders,pages,manage_panel,config
